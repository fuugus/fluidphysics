<!DOCTYPE html>
<html>
<body>
<pre id="out">probing…</pre>
<script type="module">
const out = [];
const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };
try {
  if (!navigator.gpu) throw new Error('navigator.gpu missing');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('no adapter');
  const info = adapter.info || {};
  log(`ADAPTER: vendor=${info.vendor} arch=${info.architecture} device=${info.device} desc=${info.description}`);
  log(`FEATURES: timestamp-query=${adapter.features.has('timestamp-query')} f16=${adapter.features.has('shader-f16')}`);
  log(`LIMITS: maxStorage=${adapter.limits.maxStorageBuffersPerShaderStage} maxWG=${adapter.limits.maxComputeInvocationsPerWorkgroup} maxBuf=${(adapter.limits.maxStorageBufferBindingSize/1e6)|0}MB`);
  const device = await adapter.requestDevice({
    requiredFeatures: adapter.features.has('timestamp-query') ? ['timestamp-query'] : [],
  });
  // trivial compute: y[i] = x[i] * 2 over 1M floats, timed
  const N = 1 << 20;
  const buf = device.createBuffer({ size: N * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(buf, 0, new Float32Array(N).fill(21));
  const mod = device.createShaderModule({ code: `
    @group(0) @binding(0) var<storage, read_write> x: array<f32>;
    @compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g: vec3u) {
      if (g.x < ${N}u) { x[g.x] = x[g.x] * 2.0; }
    }` });
  const pipe = device.createComputePipeline({ layout: 'auto', compute: { module: mod } });
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }] });
  const t0 = performance.now();
  for (let r = 0; r < 100; r++) {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setPipeline(pipe); pass.setBindGroup(0, bg);
    pass.dispatchWorkgroups(N / 256);
    pass.end();
    device.queue.submit([enc.finish()]);
  }
  await device.queue.onSubmittedWorkDone();
  const ms = performance.now() - t0;
  const rb = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyBufferToBuffer(buf, 0, rb, 0, 16);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const v = new Float32Array(rb.getMappedRange())[0];
  log(`COMPUTE: 100 dispatches over 1M floats in ${ms.toFixed(1)}ms, value=${v} (expect 21*2^100 = inf) → ${v === Infinity ? 'OK' : 'check'}`);
  log('RESULT: PASS');
} catch (e) {
  log('RESULT: FAIL — ' + e.message);
}
</script>
</body>
</html>
